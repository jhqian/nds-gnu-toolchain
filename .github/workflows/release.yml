#
# GitHub Release workflow for building NDS32 ELF toolchain on macOS

name: Release Build

on:
  push:
#    tags:
#      - 'v*'
    branches:
      - 'test'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos-x86_64:
    name: Build macOS (x86_64)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Initialize Submodules
        run: |
          git submodule update --init --recursive

      - name: Install Build Dependencies
        run: |
          # Check current architecture
          CURRENT_ARCH=$(uname -m)
          echo "Current architecture: $CURRENT_ARCH"
          
          # Install dependencies function for x86_64 mode
          install_deps_x86_64() {
            echo "Installing build dependencies via Homebrew (x86_64 mode)..."
            echo "Current architecture in x86_64 mode: $(uname -m)"
            
            # Set up environment for x86_64 Homebrew
            export PATH="/usr/local/bin:/usr/local/sbin:$PATH"
            export HOMEBREW_PREFIX="/usr/local"
            export HOMEBREW_CELLAR="/usr/local/Cellar"
            export HOMEBREW_REPOSITORY="/usr/local/Homebrew"
            export HOMEBREW_NO_AUTO_UPDATE=1
            
            # Ensure Homebrew is available in /usr/local (x86_64 prefix)
            if [ ! -f /usr/local/bin/brew ]; then
              echo "Installing Homebrew to /usr/local (x86_64)..."
              CURRENT_USER=$(whoami)
              
              # Create directory structure with proper permissions
              sudo mkdir -p /usr/local/Homebrew /usr/local/Cellar /usr/local/opt /usr/local/bin /usr/local/share /usr/local/var/homebrew/locks /usr/local/etc /usr/local/include /usr/local/lib /usr/local/Frameworks
              sudo chown -R $CURRENT_USER /usr/local/Homebrew /usr/local/Cellar /usr/local/opt /usr/local/bin /usr/local/share /usr/local/var /usr/local/etc /usr/local/include /usr/local/lib /usr/local/Frameworks
              
              # Clone Homebrew directly
              git clone https://github.com/Homebrew/brew /usr/local/Homebrew || {
                echo "Failed to clone Homebrew repository"
                exit 1
              }
              
              # Create brew symlink
              ln -sf /usr/local/Homebrew/bin/brew /usr/local/bin/brew || {
                echo "Failed to create brew symlink"
                exit 1
              }
              
              # Ensure var directory exists and has correct permissions
              mkdir -p /usr/local/var/homebrew/locks
              chmod -R 755 /usr/local/var
            else
              # Ensure permissions are correct even if Homebrew already exists
              CURRENT_USER=$(whoami)
              sudo mkdir -p /usr/local/var/homebrew/locks /usr/local/etc /usr/local/include /usr/local/lib /usr/local/Frameworks 2>/dev/null || true
              sudo chown -R $CURRENT_USER /usr/local/var/homebrew /usr/local/etc /usr/local/include /usr/local/lib /usr/local/Frameworks 2>/dev/null || true
              mkdir -p /usr/local/var/homebrew/locks /usr/local/etc /usr/local/include /usr/local/lib /usr/local/Frameworks 2>/dev/null || true
              chmod -R 755 /usr/local/var/homebrew /usr/local/etc /usr/local/include /usr/local/lib /usr/local/Frameworks 2>/dev/null || true
            fi
            
            # Verify brew is available
            if [ ! -f /usr/local/bin/brew ]; then
              echo "Error: Homebrew not found at /usr/local/bin/brew"
              exit 1
            fi
            
            # Set up Homebrew environment
            eval "$(/usr/local/bin/brew shellenv)" || true
            
            # Ensure permissions before updating
            CURRENT_USER=$(whoami)
            sudo mkdir -p /usr/local/var/homebrew/locks /usr/local/etc /usr/local/include /usr/local/lib /usr/local/Frameworks 2>/dev/null || true
            sudo chown -R $CURRENT_USER /usr/local/var/homebrew /usr/local/etc /usr/local/include /usr/local/lib /usr/local/Frameworks 2>/dev/null || true
            mkdir -p /usr/local/var/homebrew/locks /usr/local/etc /usr/local/include /usr/local/lib /usr/local/Frameworks 2>/dev/null || true
            chmod -R 755 /usr/local/var/homebrew /usr/local/etc /usr/local/include /usr/local/lib /usr/local/Frameworks 2>/dev/null || true
            
            # Update Homebrew
            echo "Updating Homebrew..."
            /usr/local/bin/brew update || true
            
            # Remove conflicting symlinks if they exist
            echo "Removing conflicting Python symlinks..."
            rm -f /usr/local/bin/idle3 /usr/local/bin/idle3.14 /usr/local/bin/pip3 /usr/local/bin/pip3.14 /usr/local/bin/pydoc3 /usr/local/bin/pydoc3.14 /usr/local/bin/python3 /usr/local/bin/python3-config /usr/local/bin/python3.14 /usr/local/bin/python3.14-config 2>/dev/null || true
            
            # Install required dependencies with --overwrite to handle conflicts
            echo "Installing dependencies: make gcc python3 texinfo gmp mpfr libmpc"
            /usr/local/bin/brew install --overwrite make gcc python3 texinfo gmp mpfr libmpc || {
              echo "Failed to install dependencies, trying without --overwrite..."
              /usr/local/bin/brew install make gcc python3 texinfo gmp mpfr libmpc || {
                echo "Failed to install dependencies"
                exit 1
              }
            }
            
            echo "✓ All dependencies installed successfully"
          }
          
          # Install dependencies function for native mode
          install_deps_native() {
            echo "Installing build dependencies via Homebrew..."
            
            # Ensure Homebrew is available
            if ! command -v brew > /dev/null 2>&1; then
              echo "Installing Homebrew..."
              /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
              # Add Homebrew to PATH
              if [ -f /opt/homebrew/bin/brew ]; then
                eval "$(/opt/homebrew/bin/brew shellenv)"
              elif [ -f /usr/local/bin/brew ]; then
                eval "$(/usr/local/bin/brew shellenv)"
              fi
            fi
            
            # Update Homebrew
            echo "Updating Homebrew..."
            brew update || true
            
            # Install required dependencies
            echo "Installing dependencies: make gcc python3 texinfo gmp mpfr libmpc"
            brew install make gcc python3 texinfo gmp mpfr libmpc || {
              echo "Failed to install dependencies"
              exit 1
            }
            
            echo "✓ All dependencies installed successfully"
          }
          
          # If running on ARM64, use Rosetta 2 to install x86_64 dependencies
          if [ "$CURRENT_ARCH" = "arm64" ]; then
            echo "Running on ARM64, installing x86_64 dependencies via Rosetta 2"
            arch -x86_64 bash -c "$(declare -f install_deps_x86_64); install_deps_x86_64"
          else
            install_deps_native
          fi

      - name: Cache Build Directory
        id: cache-build
        uses: actions/cache@v4
        with:
          path: |
            build-nds32le-elf-newlib-v5
            $HOME/toolchains/nds32le-elf-newlib-v5
          key: ${{ runner.os }}-toolchain-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-toolchain-build-

      - name: Build Toolchain
        timeout-minutes: 360
        run: |
          # Check current architecture
          CURRENT_ARCH=$(uname -m)
          echo "Current architecture: $CURRENT_ARCH"
          
          # Increase parallel build jobs (use all available CPUs)
          CPU_COUNT=$(sysctl -n hw.ncpu 2>/dev/null || echo 4)
          # Use all CPUs, but cap at reasonable limit to avoid memory issues
          PARALLEL_JOBS=$((CPU_COUNT > 8 ? 8 : CPU_COUNT))
          export MAKE_PARALLEL="-j${PARALLEL_JOBS}"
          echo "Using parallel build with $MAKE_PARALLEL jobs (CPU count: $CPU_COUNT)"
          
          # Optimize build performance
          export MAKEFLAGS="$MAKE_PARALLEL"
          export MAKE_JOBS="$PARALLEL_JOBS"
          
          # Build function for x86_64 mode
          build_toolchain_x86_64() {
            # Set up library paths for GMP and MPFR using /usr/local Homebrew
            export PATH="/usr/local/bin:$PATH"
            HOMEBREW_PREFIX="/usr/local"
            echo "Homebrew prefix: $HOMEBREW_PREFIX"
            export PKG_CONFIG_PATH="$HOMEBREW_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH"
            export CPPFLAGS="-I$HOMEBREW_PREFIX/include"
            export LDFLAGS="-L$HOMEBREW_PREFIX/lib"
            
            # Force x86_64 architecture for the build
            export ARCHFLAGS="-arch x86_64"
            export CC="gcc -arch x86_64"
            export CXX="g++ -arch x86_64"
            export MACOSX_DEPLOYMENT_TARGET=10.15
            
            # Override MAKE_PARALLEL in build script
            export MAKE_PARALLEL="$MAKE_PARALLEL"
            
            chmod +x build_elf_toolchain_macos.sh
            ./build_elf_toolchain_macos.sh
          }
          
          # Build function for native mode
          build_toolchain_native() {
            # Set up library paths for GMP and MPFR
            HOMEBREW_PREFIX=$(brew --prefix)
            echo "Homebrew prefix: $HOMEBREW_PREFIX"
            export PKG_CONFIG_PATH="$HOMEBREW_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH"
            export CPPFLAGS="-I$HOMEBREW_PREFIX/include"
            export LDFLAGS="-L$HOMEBREW_PREFIX/lib"
            
            # Override MAKE_PARALLEL in build script
            export MAKE_PARALLEL="$MAKE_PARALLEL"
            
            chmod +x build_elf_toolchain_macos.sh
            ./build_elf_toolchain_macos.sh
          }
          
          # If running on ARM64, use Rosetta 2 to build x86_64 toolchain
          if [ "$CURRENT_ARCH" = "arm64" ]; then
            echo "Running on ARM64, building x86_64 toolchain via Rosetta 2"
            arch -x86_64 bash -c "$(declare -f build_toolchain_x86_64); build_toolchain_x86_64"
          else
            echo "Running on x86_64, building natively"
            build_toolchain_native
          fi

      - name: Package Toolchain
        run: |
          mkdir -p artifacts/nds32le-elf-macos-x86_64
          cd $HOME/toolchains
          tar czf ${{ github.workspace }}/artifacts/nds32le-elf-macos-x86_64/nds32le-elf-macos-x86_64.tar.gz nds32le-elf-newlib-v5

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nds32le-elf-macos-x86_64
          path: artifacts/nds32le-elf-macos-x86_64/nds32le-elf-macos-x86_64.tar.gz
          retention-days: 7

