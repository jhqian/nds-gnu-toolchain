  create-release:
    name: Create Release
    needs: [build-macos-x86_64]
    runs-on: ubuntu-latest
    # Only create release when pushing a tag, not a branch
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Get tag name
        id: tag
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/(.+)$ ]]; then
            TAG_NAME="${BASH_REMATCH[1]}"
            echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "Tag name: $TAG_NAME"
          else
            echo "Error: GITHUB_REF is not a tag: $GITHUB_REF"
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or update release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/nds32le-elf-macos-x86_64/nds32le-elf-macos-x86_64.tar.gz
#            artifacts/nds32le-elf-linux-x86_64/nds32le-elf-linux-x86_64.tar.gz
#            artifacts/nds32le-elf-macos-arm64/nds32le-elf-macos-arm64.tar.gz
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
